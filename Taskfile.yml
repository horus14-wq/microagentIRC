version: '3'

tasks:
  fmt:
    cmds:
      - gofumpt -l -w .
  fmt:check:
    cmds:
      - |
        files="$(gofumpt -l .)" || exit 1
        test -z "$files" || { printf '%s\n' "$files"; exit 1; }
  vet:
    cmds:
      - go vet ./...
  lint:
    cmds:
      - golangci-lint run
  test:
    env:
      CGO_ENABLED: '1'
    cmds:
      - go test -race -count=1 ./...
  build:
    env:
      CGO_ENABLED: '0'
    cmds:
      - go build -trimpath -ldflags "-s -w" -o bin/mairc ./cmd/mairc
  vuln:
    cmds:
      - govulncheck ./...
  check:
    cmds:
      - task: fmt:check
      - task: vet
      - task: lint
      - task: test
      - task: build
