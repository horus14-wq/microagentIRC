name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - {goos: linux, goarch: amd64, suffix: '', archive: tar.gz}
          - {goos: linux, goarch: arm64, suffix: '', archive: tar.gz}
          - {goos: darwin, goarch: amd64, suffix: '', archive: tar.gz}
          - {goos: darwin, goarch: arm64, suffix: '', archive: tar.gz}
          - {goos: windows, goarch: amd64, suffix: '.exe', archive: zip}
          - {goos: windows, goarch: arm64, suffix: '.exe', archive: zip}
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
      - uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Build static binary
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -trimpath -ldflags "-s -w" -o stage/mairc${{ matrix.suffix }} ./cmd/mairc
      - name: Archive with LICENSE and NOTICE
        shell: bash
        run: |
          cp LICENSE NOTICE stage/
          mkdir -p dist
          cd stage
          name="mairc_${{ matrix.goos }}_${{ matrix.goarch }}"
          if [ "${{ matrix.archive }}" = "zip" ]; then
            zip -q "../dist/${name}.zip" *
          else
            tar -czf "../dist/${name}.tar.gz" *
          fi
          cd ../dist
          shasum -a 256 "${name}.${{ matrix.archive }}" >> SHA256SUMS
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: dist-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: Publish release with archives and SHA256SUMS
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls -la dist
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "$GITHUB_REF_NAME" \
            --notes "Prebuilt mairc binaries. Verify with \`shasum -a 256 -c SHA256SUMS\`."

  verify:
    name: verify (${{ matrix.os }})
    needs: publish
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, goos: linux, goarch: amd64, archive: tar.gz, suffix: ''}
          - {os: macos-latest, goos: darwin, goarch: arm64, archive: tar.gz, suffix: ''}
          - {os: windows-latest, goos: windows, goarch: amd64, archive: zip, suffix: '.exe'}
    steps:
      - name: Download this platform's archive
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          name="mairc_${{ matrix.goos }}_${{ matrix.goarch }}"
          gh release download "$GITHUB_REF_NAME" --pattern "${name}.${{ matrix.archive }}" --pattern SHA256SUMS --dir dl
          cd dl
          grep "${name}" SHA256SUMS | shasum -a 256 -c -
          if [ "${{ matrix.archive }}" = "zip" ]; then
            unzip -q "${name}.zip" -d pkg
          else
            mkdir pkg && tar -xzf "${name}.tar.gz" -C pkg
          fi
          chmod +x "pkg/mairc${{ matrix.suffix }}" 2>/dev/null || true
          "pkg/mairc${{ matrix.suffix }}" version
          "pkg/mairc${{ matrix.suffix }}" install --dry-run --yes || true
          "pkg/mairc${{ matrix.suffix }}" doctor || true
